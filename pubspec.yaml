name: reaxdb_dart
description: "Embedded NoSQL database for Dart. LSM storage with a write-ahead log, ACID transactions, secondary indexes, AES-256-GCM encryption, TTL and change streams. No native dependencies."
version: 2.5.0
homepage: https://github.com/dvxlabs520/Reax-BD
repository: https://github.com/dvxlabs520/Reax-BD
issue_tracker: https://github.com/dvxlabs520/Reax-BD/issues

topics:
  - database
  - nosql
  - offline-first
  - storage
  - cache

false_secrets:
  - "*AKIAIOSFODNN7EXAMPLE*"

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  path: ^1.8.3
  crypto: ^3.0.3
  # PointyCastle provides PBKDF2 and AES-256-GCM in pure Dart.
  pointycastle: ^4.0.0

dev_dependencies:
  test: ^1.31.0
  lints: ^6.0.0
  hive_ce: ^2.22.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
